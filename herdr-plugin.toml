id = "simpikkle.dashboard"
name = "Dashboard"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Track GitHub issues, Jira tickets and untitled work through created → research → code → testing → pr → merged"
platforms = ["linux", "macos"]

[[panes]]
id = "board"
title = "Dashboard"
placement = "tab"
command = ["python3", "dashboard", "board"]

[[panes]]
id = "board-popup"
title = "Dashboard"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "dashboard", "board", "--popup"]

[[actions]]
id = "board-popup"
title = "Show dashboard (popup)"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint board-popup"]

[[actions]]
id = "open-board"
title = "Open dashboard"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint board --focus"]

[[panes]]
id = "enroll"
title = "Enroll pane"
placement = "popup"
width = "70%"
height = 12
command = ["python3", "dashboard", "enroll"]

[[actions]]
id = "enroll"
title = "Enroll pane in dashboard"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint enroll --env DASHBOARD_PANE=\"$HERDR_PANE_ID\""]

[[panes]]
id = "setup"
title = "Dashboard setup"
placement = "popup"
width = "70%"
height = 24
command = ["python3", "dashboard", "setup", "--wait"]

[[actions]]
id = "setup"
title = "Set up dashboard (CLI and Claude Code hooks)"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint setup"]
